name: Build and Release Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Locate Project File
        id: locate
        shell: powershell
        run: |
          $csproj = (Get-ChildItem -Recurse -Filter "FPSGridGenerator.csproj" | Select-Object -First 1).FullName
          Write-Host "Found CSProj: $csproj"
          echo "CSPROJ=$csproj" >> $env:GITHUB_ENV

      - name: Restore NuGet Packages
        run: nuget restore "${{ env.CSPROJ }}"

      - name: Build Solution (x64 Release)
        run: msbuild "${{ env.CSPROJ }}" /p:Configuration=Release /p:Platform=x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare Installer Paths & Run Inno Setup
        shell: powershell
        run: |
          # 1. Create root output directory
          $outDir = Join-Path $PWD "bin"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 2. Find compiled DLL, Manifest, and ISS script
          $dll = (Get-ChildItem -Recurse -Filter "FPSGridGenerator.dll" | Where-Object { $_.FullName -like "*bin\Release*" } | Select-Object -First 1).FullName
          $manifest = (Get-ChildItem -Recurse -Filter "PackageContents.xml" | Select-Object -First 1).FullName
          $iss = (Get-ChildItem -Recurse -Filter "setup.iss" | Select-Object -First 1).FullName

          Write-Host "DLL: $dll"
          Write-Host "Manifest: $manifest"
          Write-Host "ISS: $iss"
          Write-Host "Output: $outDir"

          if (-not $dll -or -not $manifest -or -not $iss) {
            Write-Error "Missing critical build files!"
            exit 1
          }

          # 3. Locate ISCC compiler
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe).Source
          }

          # 4. Compile with injected absolute paths
          & $iscc "/O$outDir" "/DDllSource=$dll" "/DManifestSource=$manifest" "$iss"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS_Grid_Generator_Setup
          path: bin/FPS_Grid_Generator_Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/FPS_Grid_Generator_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
